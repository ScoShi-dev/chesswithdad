<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess PWA</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        #app { text-align: center; }
        #chessboard { display: inline-grid; grid-template-columns: repeat(8, 40px); gap: 1px; background-color: #000; padding: 1px; }
        .square { width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; }
        .white { background-color: #f0d9b5; }
        .black { background-color: #b58863; }
        .selected { background-color: #7fff00; }
        #controls { margin-top: 20px; }
        button { margin: 0 10px; padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <div id="app">
        <h1>Chess PWA</h1>
        <div id="chessboard"></div>
        <div id="controls">
            <button id="newGame">New Game</button>
            <button id="offerGame">Offer Game</button>
            <input id="joinCode" type="text" placeholder="Enter join code">
            <button id="joinGame">Join Game</button>
        </div>
        <p id="status"></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.3.2/peerjs.min.js"></script>
    <script>
        class ChessGame {
            constructor() {
                this.board = this.initializeBoard();
                this.currentPlayer = 'white';
                this.selected = null;
            }

            initializeBoard() {
                return [
                    ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
                    ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
                    ['', '', '', '', '', '', '', ''],
                    ['', '', '', '', '', '', '', ''],
                    ['', '', '', '', '', '', '', ''],
                    ['', '', '', '', '', '', '', ''],
                    ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
                    ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
                ];
            }

            movePiece(from, to) {
                const [fromRow, fromCol] = from;
                const [toRow, toCol] = to;
                this.board[toRow][toCol] = this.board[fromRow][fromCol];
                this.board[fromRow][fromCol] = '';
                this.currentPlayer = this.currentPlayer === 'white' ? 'black' : 'white';
            }

            isValidMove(from, to) {
                // This is a simplified move validation
                // In a real chess game, you'd need to implement all the rules for each piece
                return true;
            }
        }

        class ChessPWA {
            constructor() {
                this.game = new ChessGame();
                this.boardElement = document.getElementById('chessboard');
                this.statusElement = document.getElementById('status');
                this.peer = new Peer();
                this.connection = null;
                this.isHost = false;

                this.renderBoard();
                this.setupEventListeners();
            }

            renderBoard() {
                this.boardElement.innerHTML = '';
                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 8; j++) {
                        const square = document.createElement('div');
                        square.classList.add('square', (i + j) % 2 === 0 ? 'white' : 'black');
                        square.dataset.row = i;
                        square.dataset.col = j;
                        square.textContent = this.game.board[i][j];
                        this.boardElement.appendChild(square);
                    }
                }
                this.statusElement.textContent = `Current player: ${this.game.currentPlayer}`;
            }

            setupEventListeners() {
                this.boardElement.addEventListener('click', (e) => this.handleSquareClick(e));
                document.getElementById('newGame').addEventListener('click', () => this.newGame());
                document.getElementById('offerGame').addEventListener('click', () => this.offerGame());
                document.getElementById('joinGame').addEventListener('click', () => this.joinGame());

                this.peer.on('open', (id) => {
                    console.log('My peer ID is: ' + id);
                });

                this.peer.on('connection', (conn) => {
                    this.connection = conn;
                    this.setupConnectionListeners();
                });
            }

            handleSquareClick(e) {
                if (!e.target.classList.contains('square')) return;
                const row = parseInt(e.target.dataset.row);
                const col = parseInt(e.target.dataset.col);

                if (this.game.selected) {
                    if (this.game.isValidMove(this.game.selected, [row, col])) {
                        this.game.movePiece(this.game.selected, [row, col]);
                        this.game.selected = null;
                        this.renderBoard();
                        if (this.connection) {
                            this.connection.send({type: 'move', board: this.game.board, currentPlayer: this.game.currentPlayer});
                        }
                    } else {
                        this.game.selected = null;
                        this.renderBoard();
                    }
                } else if (this.game.board[row][col]) {
                    this.game.selected = [row, col];
                    e.target.classList.add('selected');
                }
            }

            newGame() {
                this.game = new ChessGame();
                this.renderBoard();
            }

            offerGame() {
                this.isHost = true;
                this.statusElement.textContent = `Your game code is: ${this.peer.id}`;
            }

            joinGame() {
                const code = document.getElementById('joinCode').value;
                this.connection = this.peer.connect(code);
                this.setupConnectionListeners();
            }

            setupConnectionListeners() {
                this.connection.on('open', () => {
                    this.statusElement.textContent = 'Connected to opponent';
                    if (!this.isHost) {
                        this.connection.send({type: 'requestBoard'});
                    }
                });

                this.connection.on('data', (data) => {
                    if (data.type === 'move') {
                        this.game.board = data.board;
                        this.game.currentPlayer = data.currentPlayer;
                        this.renderBoard();
                    } else if (data.type === 'requestBoard') {
                        this.connection.send({type: 'move', board: this.game.board, currentPlayer: this.game.currentPlayer});
                    }
                });
            }
        }

        new ChessPWA();

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker not registered', err));
        }
    </script>
</body>
</html>
